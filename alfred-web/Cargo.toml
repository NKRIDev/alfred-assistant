[package]
name = "alfred-web"
version = "0.1.0"
edition = "2024"

[dependencies]
alfred-core = { path = "../alfred-core" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.22.1"