[package]
name = "alfred-assistant"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono-tz = "0.10.4"
chrono = "0.4.45"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.1", features = ["bundled"] }
whisper-rs = "0.16.0"
hound = "3.5.1"
