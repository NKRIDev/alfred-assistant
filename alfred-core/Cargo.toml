[package]
name = "alfred-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "alfred_core"
path = "src/lib.rs"

[dependencies]
chrono-tz = "0.10.4"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.13.3", features = ["blocking", "json", "stream", "query", "form"] }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.1", features = ["bundled"] }
whisper-rs = "0.16.0"
hound = "3.5.1"
cpal = "0.18.1"
rodio = "0.22.2"
audiopus = "0.2.0"
symphonia = { version = "0.5", features = ["opt-simd", "mkv"] }
base64 = "0.22.1"